<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MyFCS</title>
<style>
  :root{
    --navy:#0F2E46; --navy2:#16405f; --ink:#12222f; --muted:#5b7285;
    --bg:#F2F6F9; --card:#ffffff; --rule:#dde7ee; --green:#1E9E56; --amber:#B45309; --red:#C22B1E;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink)}
  #app{min-height:100%;display:flex;flex-direction:column}
  .top{background:var(--navy);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
  .top .logo{font-weight:800;font-size:20px;letter-spacing:.02em}
  .top .logo small{display:block;font-weight:500;font-size:11px;opacity:.75;letter-spacing:.12em}
  .top .grow{flex:1}
  .chip{font-size:12px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.15)}
  .chip.on{background:#1E9E56}
  .wrap{flex:1;max-width:860px;width:100%;margin:0 auto;padding:22px 18px 40px}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,46,70,.05)}
  h1{font-size:24px;margin:0 0 4px}
  h2{font-size:17px;margin:0 0 12px;color:var(--navy)}
  p.hint{color:var(--muted);font-size:13.5px;margin:4px 0 14px}
  label.f{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 5px}
  input.f,select.f,textarea.f{width:100%;font-size:17px;padding:13px 14px;border:1.5px solid var(--rule);border-radius:10px;background:#fff;color:var(--ink)}
  input.f:focus,select.f:focus{outline:none;border-color:var(--navy2)}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media(max-width:560px){.g2{grid-template-columns:1fr}}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:700;padding:15px 26px;border-radius:12px;border:0;cursor:pointer;background:var(--navy);color:#fff}
  .btn.big{width:100%;font-size:19px;padding:18px}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--rule)}
  .btn.green{background:var(--green)}
  .btn.warn{background:#fff;color:var(--red);border:1.5px solid #f2c9c4}
  .btn:disabled{opacity:.45}
  .btnrow{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:10px}
  .tile{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:26px 22px;cursor:pointer;box-shadow:0 1px 3px rgba(15,46,70,.06)}
  .tile:active{transform:scale(.985)}
  .tile .em{font-size:34px}
  .tile b{display:block;font-size:20px;margin:10px 0 4px;color:var(--navy)}
  .tile span{color:var(--muted);font-size:13.5px}
  table.items{width:100%;border-collapse:collapse;font-size:15px}
  table.items th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:2px solid var(--rule)}
  table.items td{padding:6px 4px;border-bottom:1px solid var(--rule);vertical-align:middle}
  table.items input,table.items select{width:100%;font-size:15px;padding:9px 8px;border:1.5px solid var(--rule);border-radius:8px}
  .x{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer;padding:4px 8px}
  .total{font-size:20px;font-weight:800;text-align:right;padding:12px 6px 0}
  /* full-screen green check overlay */
  .overlay{position:fixed;inset:0;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:50}
  .overlay h1{font-size:30px;margin:22px 0 8px}
  .overlay p{font-size:17px;opacity:.85;max-width:480px;margin:0 0 8px}
  .checkwrap{width:130px;height:130px}
  .checkwrap svg{width:100%;height:100%}
  .ck-circle{stroke:#38C172;stroke-width:4;fill:none;stroke-dasharray:302;stroke-dashoffset:302;animation:draw .7s ease forwards}
  .ck-mark{stroke:#38C172;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .45s .55s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .arrowbtn{margin-top:34px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);color:#fff;border-radius:99px;width:76px;height:76px;font-size:32px;cursor:pointer;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
  .recap{background:rgba(255,255,255,.09);border-radius:12px;padding:16px 20px;margin-top:18px;text-align:left;font-size:15px;max-width:440px;width:100%}
  .recap div{display:flex;justify-content:space-between;gap:18px;padding:4px 0}
  .recap span:first-child{opacity:.7}
  /* review list */
  .rv{font-size:15.5px}
  .rv .sec{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
  .rv .row{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px dashed var(--rule)}
  .rv .row span:first-child{color:var(--muted)}
  /* terms modal */
  .modal{position:fixed;inset:0;background:rgba(10,25,38,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  .mcard{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
  .mcard header{padding:16px 22px;border-bottom:1px solid var(--rule);font-weight:800;color:var(--navy)}
  .terms{overflow-y:auto;padding:18px 22px;font-size:13.5px;line-height:1.55;color:#233;flex:1}
  .terms p{margin:0 0 10px}
  .mfoot{padding:14px 22px;border-top:1px solid var(--rule)}
  .sig{border:1.5px dashed var(--rule);border-radius:10px;background:#fbfdfe;position:relative}
  .sig canvas{display:block;width:100%;height:150px;touch-action:none}
  .sig .clear{position:absolute;top:6px;right:8px;font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer}
  .siglabel{font-size:12px;color:var(--muted);margin:10px 0 6px}
  /* orders list */
  .ocount{display:flex;gap:22px;font-size:15px}
  .ocount b{font-size:26px;display:block;color:var(--navy)}
  .olist .o{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .olist .o .inv{font-weight:800;color:var(--navy);min-width:86px}
  .olist .o .who{flex:1;font-size:14.5px}
  .olist .o .who small{display:block;color:var(--muted)}
  .st{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px}
  .st.local{background:#FEF3C7;color:#92400E}
  .st.up{background:#D1FAE5;color:#065F46}
  .savechanges{position:sticky;top:64px;z-index:4;background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;font-weight:700;padding:12px 16px;border-radius:10px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:10px;font-size:15px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .mailbox{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted);margin-top:8px}
  .mailbox input{width:18px;height:18px;margin-top:1px}
  .backlink{background:none;border:0;color:var(--navy);font-size:15px;font-weight:700;cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ================= MyFCS — FCS Shipping tablet app =================
   Offline-first: everything saves to this tablet immediately.
   Refresh pulls settings/prices/next B/L from the admin database.
   Upload pushes local orders into the same fcs:orders the admin reads. */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$'+(Number(n)||0).toFixed(2);
const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v==null?f:JSON.parse(v); }catch(e){ return f; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
};
function todayISO(){ const d=new Date(),z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function nowTime(){ return new Date().toLocaleTimeString('en-US',{hour12:true,hour:'numeric',minute:'2-digit',second:'2-digit'}); }
function usDate(iso){ const [y,m,d]=String(iso||'').split('-'); return m?`${+m}/${+d}/${y}`:iso; }
function bumpInvoice(v){ const m=String(v||'').match(/^(\D*)(\d+)(\D*)$/); if(!m) return String(v||''); return m[1]+String(Number(m[2])+1).padStart(m[2].length,'0')+m[3]; }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }

/* ---------------- config + Supabase (REST, no SDK needed) ---------------- */
const CONFIG_URL = 'https://fcsshipping.com/admin/config.js';
let CFG = LS.get('myfcs:cfg', null);          /* {url, key} */
let AUTH = LS.get('myfcs:auth', null);        /* {access_token, refresh_token, email} */
async function loadConfig(){
  try{
    const t = await (await fetch(CONFIG_URL, {cache:'no-store'})).text();
    const u = t.match(/SUPABASE_URL\s*:\s*'([^']+)'/), k = t.match(/SUPABASE_ANON_KEY\s*:\s*'([^']+)'/);
    if(u && k && !u[1].includes('YOUR')){ CFG={url:u[1], key:k[1]}; LS.set('myfcs:cfg', CFG); return true; }
  }catch(e){}
  return !!CFG;
}
async function signIn(email, password){
  if(!CFG) await loadConfig();
  if(!CFG) throw new Error('No connection — connect to Wi-Fi first.');
  const r = await fetch(CFG.url+'/auth/v1/token?grant_type=password',{
    method:'POST', headers:{apikey:CFG.key,'Content-Type':'application/json'},
    body:JSON.stringify({email,password})});
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description||d.msg||'Sign-in failed');
  AUTH = {access_token:d.access_token, refresh_token:d.refresh_token, email};
  LS.set('myfcs:auth', AUTH);
}
async function refreshToken(){
  if(!AUTH||!CFG) return false;
  try{
    const r = await fetch(CFG.url+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST', headers:{apikey:CFG.key,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:AUTH.refresh_token})});
    const d = await r.json();
    if(!r.ok) return false;
    AUTH = {access_token:d.access_token, refresh_token:d.refresh_token, email:AUTH.email};
    LS.set('myfcs:auth', AUTH); return true;
  }catch(e){ return false; }
}
async function rest(path, opts={}, retry=true){
  if(!CFG) throw new Error('offline');
  const r = await fetch(CFG.url+'/rest/v1/'+path, {...opts, headers:{
    apikey:CFG.key, Authorization:'Bearer '+(AUTH?AUTH.access_token:CFG.key),
    'Content-Type':'application/json', ...(opts.headers||{}) }});
  if(r.status===401 && retry && await refreshToken()) return rest(path, opts, false);
  if(r.status===401){ throw new Error('signin'); }
  return r;
}
async function kvLoad(key, fallback){
  const r = await rest('settings?key=eq.'+encodeURIComponent(key)+'&select=value');
  if(!r.ok) throw new Error('load '+key+' failed ('+r.status+')');
  const d = await r.json();
  return (d[0] && d[0].value!=null) ? d[0].value : fallback;
}
async function kvSave(key, value){
  const r = await rest('settings',{method:'POST',
    headers:{Prefer:'resolution=merge-duplicates'},
    body:JSON.stringify({key, value, updated_at:new Date().toISOString()})});
  if(!r.ok) throw new Error('save '+key+' failed ('+r.status+')');
}

/* ---------------- local data ---------------- */
const DEFAULT_V2 = {
  dests:[{name:'Vieux-Fort St. Lucia',rate:7,barrel:105,bin:190},{name:'Port Castries St. Lucia',rate:7,barrel:100,bin:190}],
  products:[{name:'Empty Barrel',price:60},{name:'Pickup Fee',price:25}],
  shipTypes:[{name:'TV/Crate',dims:'',cuft:''},{name:'Crate',dims:'',cuft:''},{name:'Pallet',dims:'',cuft:''},{name:'Bag',dims:'',cuft:''}],
  recv:['SEA FREIGHT','AIR FREIGHT','STANDARD'],
};
let V2      = LS.get('myfcs:v2', DEFAULT_V2);
let orders  = LS.get('myfcs:orders', []);
let NEXT    = LS.get('myfcs:next', null);       /* last known "next B/L" from admin */
let FRESH   = LS.get('myfcs:nextFresh', false); /* true when NEXT came from a live refresh */
function saveOrders(){ LS.set('myfcs:orders', orders); }

/* ---------------- pricing (ported from admin) ---------------- */
const MIN_FREIGHT = 65;
function destOf(name){ return V2.dests.find(d=>d.name===name)||null; }
function dimsToCuft(dims){
  const m=String(dims||'').match(/(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+(?:\.\d+)?)/);
  return m ? Math.max(1, Math.round(m[1]*m[2]*m[3]/1728)) : null;
}
function priceItem(it, destName){
  const d=destOf(destName); const rate=d?Number(d.rate)||0:0;
  const desc=String(it.desc||'').toLowerCase();
  if(it.kind==='product'){ it.cuft=''; it.dims=''; return; }
  const st=V2.shipTypes.find(x=>String(x.name).toLowerCase()===desc);
  const q=Math.max(1,parseFloat(it.qty)||1);
  let unit=null, price=null;
  if(desc==='barrel'){ it.dims='24X24X44'; unit=15; price = d&&d.barrel?Number(d.barrel):(rate?15*rate:null); }
  else if(desc==='commercial bin'){ it.dims='48X24X44'; unit=20; price = d&&d.bin?Number(d.bin):(rate?20*rate:null); }
  else if(st){ if(st.dims&&!it.dims) it.dims=st.dims; unit = dimsToCuft(it.dims) ?? (parseFloat(st.cuft)||null); if(unit!=null&&rate) price=unit*rate; }
  else { unit=dimsToCuft(it.dims); if(unit!=null&&rate) price=unit*rate; }
  if(unit!=null) it.cuft=String(unit*q);
  if(price!=null) it.price=String(Math.max(MIN_FREIGHT, Math.round(price*100)/100));
  it.amount='';
}
function itemAmount(it){
  if(it.amount!==''&&it.amount!=null) return Number(String(it.amount).replace(/[^0-9.\-]/g,''))||0;
  const q=parseFloat(it.qty), p=parseFloat(String(it.price).replace(/[^0-9.\-]/g,''));
  return (isFinite(q)&&isFinite(p))?q*p:0;
}
function orderTotal(o){ return o.items.reduce((s,it)=>s+itemAmount(it),0); }

/* ---------------- B/L numbers ----------------
   Online (refreshed): use the admin's next number, then advance it locally.
   Offline: last number with a "2" in front so it can never collide. */
function nextBL(){
  let inv;
  if(NEXT && FRESH){ inv = String(NEXT); }
  else {
    const base = NEXT || (orders.length ? orders[orders.length-1].inv : '16000');
    const digits = String(base).replace(/\D/g,'') || '16000';
    inv = '2'+digits;
  }
  while(orders.some(o=>String(o.inv)===String(inv))) inv = bumpInvoice(inv);
  return inv;
}
function consumeBL(inv){
  if(NEXT && FRESH && String(inv)===String(NEXT)){ NEXT=bumpInvoice(NEXT); LS.set('myfcs:next',NEXT); }
  else if(!FRESH){ NEXT = String(inv).replace(/^2/,''); LS.set('myfcs:next',NEXT); }
}

/* ---------------- sync ---------------- */
async function doRefresh(){
  toast('Refreshing from admin…');
  try{
    if(!await loadConfig()) throw new Error('No connection.');
    const v2 = await kvLoad('fcs:v2', null);
    if(v2){ V2 = {...DEFAULT_V2, ...v2}; LS.set('myfcs:v2', V2); }
    const s = await kvLoad('fcs:settings', {});
    if(s && s.next){ NEXT=String(s.next); FRESH=true; LS.set('myfcs:next',NEXT); LS.set('myfcs:nextFresh',true); }
    LS.set('myfcs:lastRefresh', Date.now());
    toast('Up to date ✓  (prices, products, B/L number)');
  }catch(e){
    if(String(e.message)==='signin'){ go('login'); return; }
    toast('Could not refresh: '+e.message);
  }
  render();
}
async function doUpload(){
  const pending = orders.filter(o=>!o._uploaded || o._dirty);
  if(!pending.length){ toast('Nothing new to upload — all synced ✓'); return; }
  toast('Uploading '+pending.length+' order(s)…');
  try{
    if(!await loadConfig()) throw new Error('No connection.');
    const remote = await kvLoad('fcs:orders', []);
    /* merge without duplicating: match by id, else append */
    pending.forEach(o=>{
      const up = tabletToAdmin(o);
      const i = remote.findIndex(r=>r.id===up.id);
      if(i>-1) remote[i]=up; else remote.push(up);
    });
    await kvSave('fcs:orders', remote);
    /* keep the admin's next B/L ahead of anything we used */
    try{
      const s = await kvLoad('fcs:settings', {});
      const maxNum = Math.max(...remote.map(r=>parseInt(String(r.inv).replace(/\D/g,''),10)||0));
      const curNext = parseInt(String(s.next||'0').replace(/\D/g,''),10)||0;
      if(maxNum>=curNext && String(maxNum).length===String(curNext||maxNum).length){
        s.next = String(maxNum+1); await kvSave('fcs:settings', s);
      }
    }catch(e){}
    const now=Date.now();
    pending.forEach(o=>{ o._uploaded=true; o._dirty=false; o._uploadedAt=now; });
    saveOrders();
    toast(pending.length+' order(s) uploaded to admin ✓');
  }catch(e){
    if(String(e.message)==='signin'){ go('login'); return; }
    toast('Upload failed: '+e.message+' — your orders are safe on this tablet.');
  }
  render();
}
function tabletToAdmin(o){
  return {
    id:o.id, inv:o.inv, invDate:o.invDate, pickup:o.pickup, time:o.time,
    po:'',container:'',code:'',shipVia:'',cross:'',service:'',
    recv:o.recv, sh:o.sh, co:o.co, items:o.items,
    showTotal:true, amtRecd:o.amtRecd||'', payMethod:o.payMethod||'',
    created:true, qbInvoiceNo:'', qbOk:null, paid:false, _v2:true,
    _tablet:true, shEmail:o.shEmail||'', mailReceipt:!!o.mailReceipt,
    signature:o.signature||'', termsAcceptedAt:o.termsAcceptedAt||'',
  };
}

    + '<option value="OTHER">Other…</option>';
}
function vItems(){

  return header()+`<div class="wrap">
    <button class="backlink" onclick="go('shipper')">‹ Back to customer info</button>
    ${editing?svChanges():''}

      <h2>Cargo — BL# ${esc(o.inv)} · ${esc(o.co.city||'')}</h2>

      <table class="items"><thead><tr><th style="width:64px">Qty</th><th>Description</th><th style="width:70px">Cu ft</th><th style="width:110px">Dims</th><th style="width:90px">Price</th><th style="width:34px"></th></tr></thead>

      ${o.items.map((it,i)=>`<tr>
        <td><input inputmode="numeric" data-it="${i}" data-f="qty" value="${esc(it.qty)}"></td>
        <td>${it._other||((it.desc&&!['Barrel','Commercial Bin','Box'].includes(it.desc)&&!V2.shipTypes.some(s=>s.name===it.desc)&&it.kind!=='product'))
             ? `<input data-it="${i}" data-f="desc" value="${esc(it.desc)}" placeholder="Describe it…">`
             : `<select data-it="${i}" data-f="desc">${descOptions(it.kind==='product'?'P:'+it.desc:it.desc)}</select>`}</td>
        <td><input inputmode="numeric" data-it="${i}" data-f="cuft" value="${esc(it.cuft)}"></td>
        <td><input data-it="${i}" data-f="dims" value="${esc(it.dims)}" placeholder="LxWxH"></td>
        <td><input inputmode="decimal" data-it="${i}" data-f="price" value="${esc(it.price)}"></td>
        <td><button class="x" onclick="delItem(${i})">×</button></td>
      </tr>`).join('')}
      </tbody></table>
      <div class="btnrow">
        <button class="btn ghost" onclick="addItem('freight')">+ Add line</button>
        <button class="btn ghost" onclick="addItem('product')">+ Add product</button>
        <span style="flex:1"></span>
      </div>
      <div class="total">Total ${money(orderTotal(o))}</div>
      <div class="g2" style="margin-top:8px">
        <div><label class="f">Received from</label><select class="f" data-k="recv">${(V2.recv||['SEA FREIGHT']).map(r=>`<option${r===o.recv?' selected':''}>${esc(r)}</option>`).join('')}</select></div>
        <div><label class="f">Payment</label><select class="f" data-k="payMethod">
          <option value=""></option>${['CASH','ZELLE','COD','CHECK'].map(p=>`<option${p===o.payMethod?' selected':''}>${p}</option>`).join('')}</select></div>
        <div><label class="f">Amount received $</label><input class="f" inputmode="decimal" data-k="amtRecd" value="${esc(o.amtRecd)}"></div>
      </div>
    </div>
    <button class="btn big" onclick="goReview()">Review order →</button>
  </div>`;
}
function bindItems(){
  $$('[data-it]').forEach(el=>{
    el.addEventListener('change',()=>{
      const it=cur.items[+el.dataset.it]; const f=el.dataset.f;
      let v=el.value;
      if(f==='desc'){
        if(v==='OTHER'){ it._other=true; it.desc=''; it.kind='freight'; render(); return; }
        if(v.startsWith('P:')){ it.kind='product'; it.desc=v.slice(2);
          const p=V2.products.find(x=>x.name===it.desc); if(p) it.price=String(p.price);
        } else { it.kind='freight'; it.desc=v; }
      } else it[f]=v;
      if(it.kind!=='product' && (f==='desc'||f==='dims'||f==='qty')) priceItem(it, cur.co.city);
      if(editing) cur._dirty=true;
      render();
    });
  });
}
function addItem(kind){ cur.items.push({qty:'1',desc:'',cuft:'',dims:'',price:'',amount:'',kind}); render(); }
function delItem(i){ cur.items.splice(i,1); if(!cur.items.length) addItem('freight'); render(); }
function goReview(){
  cur.items = cur.items.filter(it=>it.desc);
  if(!cur.items.length){ toast('Add at least one cargo line.'); addItem('freight'); return; }
  go('review');
}

/* ---- 5. TERMS + SIGNATURE ---- */
function openTerms(){
  const m=document.createElement('div'); m.className='modal'; m.id='termsModal';
  m.innerHTML=`<div class="mcard">
    <header>Terms &amp; Conditions of Agreement</header>
    <div class="terms" id="termsScroll">${TERMS.map(t=>`<p>${esc(t)}</p>`).join('')}
      <p style="color:var(--muted)"><em>— End of terms. You can accept below. —</em></p></div>
    <div class="mfoot">
      <div class="siglabel">Sign with your finger (optional but appreciated):</div>
      <div class="sig"><canvas id="sigpad"></canvas><button class="clear" onclick="clearSig()">clear</button></div>
      <div class="btnrow">
        <button class="btn ghost" onclick="document.getElementById('termsModal').remove()">Back</button>
        <button class="btn green" id="acceptBtn" disabled onclick="acceptTerms()">Scroll to the bottom to accept</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(m);
  const sc=$('#termsScroll');
  const check=()=>{ if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-30){ const b=$('#acceptBtn'); b.disabled=false; b.textContent='I Accept ✓'; } };
  sc.addEventListener('scroll',check); check();
  initSig();
}
let sigDrawn=false;
function initSig(){
  const c=$('#sigpad'); const dpr=window.devicePixelRatio||1;
  const w=c.offsetWidth,h=150; c.width=w*dpr; c.height=h*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap='round'; x.strokeStyle='#12222f';
  let down=false,px=0,py=0;
  const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-r.left,t.clientY-r.top]; };
  const start=e=>{ down=true; [px,py]=pos(e); e.preventDefault(); };
  const move=e=>{ if(!down) return; const [nx,ny]=pos(e); x.beginPath(); x.moveTo(px,py); x.lineTo(nx,ny); x.stroke(); px=nx;py=ny; sigDrawn=true; e.preventDefault(); };
  const end=()=>{ down=false; };
  c.addEventListener('touchstart',start); c.addEventListener('touchmove',move); c.addEventListener('touchend',end);
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); c.addEventListener('mouseup',end);
  sigDrawn=false;
}
function clearSig(){ const c=$('#sigpad'); c.getContext('2d').clearRect(0,0,c.width,c.height); sigDrawn=false; }
function acceptTerms(){
  if(sigDrawn){ try{ cur.signature=$('#sigpad').toDataURL('image/png'); }catch(e){} }
  cur.termsAcceptedAt=new Date().toISOString();
  document.getElementById('termsModal').remove();
  finishOrder();
}

/* ---- 6. SAVE + FINAL green check ---- */
function finishOrder(){
  const o=cur;
  if(!o._savedAt){ consumeBL(o.inv); o._savedAt=Date.now(); orders.push(o); }
  else { const i=orders.findIndex(x=>x.id===o.id); if(i>-1) orders[i]=o; }
  o._uploaded=false; saveOrders();
  go('done');
}
function vDone(){
  const o=cur;
  return `<div class="overlay">
    <div class="checkwrap"><svg viewBox="0 0 100 100">
      <circle class="ck-circle" cx="50" cy="50" r="46"/>
      <path class="ck-mark" d="M30 52 L45 66 L72 36"/>
    </svg></div>
    <h1>Your stuff is on the way! 🚢</h1>

    <div class="recap">
      <div><span>B/L #</span><b>${esc(o.inv)}</b></div>
      <div><span>Shipper</span><b>${esc(o.sh.name)}</b></div>
      <div><span>To</span><b>${esc(o.co.name)} · ${esc(o.co.city)}</b></div>
      <div><span>Pieces</span><b>${o.items.reduce((s,it)=>s+(parseFloat(it.qty)||0),0)}</b></div>
      <div><span>Total</span><b>${money(orderTotal(o))}</b></div>
      ${o.shEmail?`<div><span>Receipt</span><b>${esc(o.shEmail)}</b></div>`:''}
    </div>
    <button class="btn big green" style="max-width:440px;margin-top:26px" onclick="go('home')">Done</button>

}

/* ---- ORDERS sub-app ---- */
function svChanges(){
  return `<div class="savechanges">✏️ Editing BL# ${esc(cur.inv)} <span style="flex:1"></span>
    <button class="btn" style="padding:9px 18px;font-size:14px" onclick="quickSave()">Save changes</button></div>`;
}
function quickSave(){
  const i=orders.findIndex(x=>x.id===cur.id);
  if(i>-1){ cur._dirty=true; orders[i]=cur; saveOrders(); toast('Changes saved on tablet ✓ (upload to send to admin)'); }
}
function vOrders(){
  const today=todayISO();
  const createdToday=orders.filter(o=>o.invDate===today).length;
  const upToday=orders.filter(o=>o._uploaded && o._uploadedAt && new Date(o._uploadedAt).toISOString().slice(0,10)===today).length;
  const list=[...orders].reverse();
  return header()+`<div class="wrap">
    <button class="backlink" onclick="go('home')">‹ Home</button>
    <div class="card" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div class="ocount">
        <div><b>${createdToday}</b>created today</div>
        <div><b>${upToday}</b>uploaded today</div>
        <div><b>${orders.filter(o=>!o._uploaded||o._dirty).length}</b>waiting to upload</div>
      </div>
      <span style="flex:1"></span>
      <button class="btn ghost" onclick="doRefresh()">⟳ Refresh</button>
      <button class="btn" onclick="doUpload()">⇧ Upload</button>
    </div>
    <div class="olist">
      ${list.length? list.map(o=>`<div class="o">
          <div class="inv">BL# ${esc(o.inv)}</div>
          <div class="who">${esc(o.sh.name)} → ${esc(o.co.name)}<small>${usDate(o.invDate)} · ${esc(o.co.city)} · ${money(orderTotal(o))}</small></div>
          <span class="st ${o._uploaded&&!o._dirty?'up':'local'}">${o._uploaded&&!o._dirty?'Uploaded ✓':(o._dirty?'Edited — re-upload':'On tablet')}</span>
          <button class="btn ghost" style="padding:10px 18px;font-size:14px" onclick="openOrder('${o.id}')">Open</button>
        </div>`).join('')
      : '<div class="card" style="text-align:center;color:var(--muted)">No receipts yet — make one in <b>Create</b>.</div>'}
    </div>
  </div>`;
}
function openOrder(id){
  const o=orders.find(x=>x.id===id); if(!o) return;
  cur=o; editing=true; go('shipper');
}

/* ---- LOGIN (only needed for Upload/Refresh) ---- */
function vLogin(){
  return header()+`<div class="wrap" style="max-width:460px">
    <div class="card">
      <h2>Sign in to sync</h2>
      <p class="hint">Use your FCS admin login. You only need this to Refresh or Upload — creating receipts works without it.</p>
      <label class="f">Email</label><input class="f" id="liEmail" inputmode="email" value="${esc(AUTH?AUTH.email:'')}">
      <label class="f">Password</label><input class="f" id="liPass" type="password">
      <div class="btnrow">
        <button class="btn ghost" onclick="go('orders')">Cancel</button>
        <button class="btn" onclick="doLogin()">Sign in</button>
      </div>
    </div>
  </div>`;
}
async function doLogin(){
  try{ await signIn($('#liEmail').value.trim(), $('#liPass').value); toast('Signed in ✓'); go('orders'); }
  catch(e){ toast(e.message); }
}

/* ---- render loop ---- */
function render(){
  const views={home:vHome,shipper:vShipper,handoff:vHandoff,items:vItems,review:vReview,done:vDone,orders:vOrders,login:vLogin};
  $('#app').innerHTML=(views[scr]||vHome)();
  bindInputs(); bindItems();
}
window.addEventListener('online', ()=>render());
window.addEventListener('offline', ()=>{ FRESH=false; LS.set('myfcs:nextFresh',false); render(); });
/* going offline means our fetched B/L may go stale on the admin side */
render();
/* quietly try to refresh config on boot when online */
if(navigator.onLine) loadConfig();
</script>
